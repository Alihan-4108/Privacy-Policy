<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Privacy Policy</title>
<style>
  :root {
    --bg: #f7f7f8;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e3e3e6;
    --accent: #4f46e5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --card: #1f1f24;
      --text: #ececf1;
      --muted: #a0a0a8;
      --border: #33333a;
      --accent: #8b85f5;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
  }
  h1 { font-size: 1.7rem; margin: 0 0 4px; }
  h2 { font-size: 1.15rem; margin: 28px 0 6px; }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 18px; }
  .intro { margin-bottom: 8px; }
  p { white-space: pre-wrap; margin: 8px 0; }
  a { color: var(--accent); }
  footer { color: var(--muted); font-size: 0.85rem; margin-top: 28px; text-align: center; }
  .loading, .error { color: var(--muted); }
  .error { color: #d33; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="content">
    <p class="loading">Loading...</p>
  </div>
  <footer>
    This page is generated from <code>privacy.json</code>. Raw text:
    <a href="privacy.json">privacy.json</a>
  </footer>
</div>

<script>
(async function () {
  const el = document.getElementById("content");
  try {
    const res = await fetch("privacy.json?v=" + Date.now());
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    const m = data.meta || {};

    const esc = (s) => String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // metindeki URL'leri linke cevir
    const linkify = (s) => esc(s).replace(
      /(https?:\/\/[^\s]+)/g,
      '<a href="$1" target="_blank" rel="noopener">$1</a>'
    );

    let html = "";
    html += '<h1>' + esc(m.appName || "Game") + ' - Privacy Policy</h1>';
    html += '<div class="meta">';
    if (m.company) html += esc(m.company) + " &middot; ";
    if (m.effectiveDate) html += "Effective date: " + esc(m.effectiveDate);
    if (m.lastUpdated) html += " &middot; Last updated: " + esc(m.lastUpdated);
    if (m.version) html += " &middot; v" + esc(m.version);
    html += "</div>";

    if (data.intro) html += '<p class="intro">' + linkify(data.intro) + "</p>";

    (data.sections || []).forEach((sec) => {
      html += "<h2>" + esc(sec.heading) + "</h2>";
      html += "<p>" + linkify(sec.body) + "</p>";
    });

    document.title = (m.appName ? m.appName + " - " : "") + "Privacy Policy";
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = '<p class="error">Failed to load the privacy policy: ' + err.message + "</p>";
  }
})();
</script>
</body>
</html>
